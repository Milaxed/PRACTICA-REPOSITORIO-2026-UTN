<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tarea</title>
</head>
<body>
    <form>
        <h1>My feedback form</h1>
            <div>
            <label for="">Name:</label>
            <input type="text" id="name" name="name">
            </div>

            <div>
                <label for="">Email:</label>
                <input type="email" id="email" required name="email">
            </div>

            <div>
                <label for="">Password</label>
                <input type="password" id="password" required name="password">
            </div>

            <div>
            <span> Please check all the emotions thats aplly to you:</span>
                <label form="angry_emotion">Angry</label>
                <input type="checkbox" checked value="1" id="angry_emotion" name="emotion">
            </div>

            <div>
                <label form="sad_emotion">Sad</label>
                <input type="checkbox" value="2" id="sad_emotion" name="emotion">
            </div>

            <div>
                <label form="happy_emotion">Happy</label>
                <input type="checkbox" value="3" id="happy_emotion" name="emotion">
            </div>

            <div>
                <label form="amvivalent_emotion">Ambivalent</label>
                <input type="checkbox" value="4" id="amvivalent_emotion" name="emotion"> 
            </div>

            <div>
                <span>How satisfied were you with our service?</span>
                <label for="">Very satisfied</label>
                <input type="radio" name="satisfaction" checked value="1">
            </div>

            <div>
                <label for="">Satisfied</label>
                <input type="radio" name="satisfaction" value="2">
            </div>

            <div>
                <label for="">Didn't care</label>
                <input type="radio" name="satisfaction" value="3">
            </div>

            <div>
                <label for="">Dissatisfied</label>
                <input type="radio" name="satisfaction" value="4">
            </div>

            <div>
                <label for="">Very dissatisfied</label>
                <input type="radio" name="satisfaction" value="5">
            </div>

            <div>
                <label for="comments">Further comments:</label>
                <textarea id="comments" name="comments"> </textarea>
            </div>

            <div>
                <label for="photo">Bio photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <div>
                <label> Location visited:
                    <select name="loccation">
                    <option value="Argentina"></option>
                    <option value="Otro pais"></option>
                    </select>
                </label>
            </div>

            <button type="button">Checkear</button>
    </form>
</body>
</html>
